[project]
name = "lfm3-chat"
version = "0.1.0"
description = "Local camera and voice chat with LiquidAI LFM3-Omni-2B"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "fastapi",
    "librosa",
    "numpy",
    "pillow",
    "soundfile",
    "torch",
    "torchcodec",
    "torchvision",
    "transformers>=5.20.2",
    "uvicorn",
    "websockets",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.uv]
package = false
